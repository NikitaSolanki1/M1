{% extends 'base.html' %}
{% block content %}
    <style>
        .box {
            max-width: 760px;
            margin: 28px auto;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 16px 36px rgba(18, 70, 58, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-family: Outfit, "Source Sans 3", sans-serif;
            font-size: 28px;
            color: var(--teal-dark);
        }
        p { margin: 0 0 16px; color: var(--muted); }
        .links { display: flex; gap: 10px; flex-wrap: wrap; }
        .links a {
            display: inline-block;
            padding: 10px 14px;
            background: var(--teal);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }
        .links a:hover { background: var(--teal-dark); }
        .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .stat {
            flex: 1;
            min-width: 120px;
            border: 1px solid var(--line);
            padding: 14px;
            border-radius: 12px;
            background: var(--mint);
        }
        .stat span { display: block; font-size: 24px; font-weight: 700; color: var(--teal-dark); }
        .stat small { color: var(--muted); }
    </style>

    <div class="box">
        <h1>Admin home</h1>
        <p>Add a course or an exam from here.</p>
        <div class="stats">
            <div class="stat"><span>{{ course_count }}</span><small>Courses</small></div>
            <div class="stat"><span>{{ exam_count }}</span><small>Exams</small></div>
            <div class="stat"><span>{{ student_count }}</span><small>Students</small></div>
            <div class="stat"><span>{{ examinor_count }}</span><small>Examiners</small></div>
        </div>
        <div class="links">
            <a href="/control/create_course">New course</a>
            <a href="/control/create_exam">New exam</a>
            <a href="/control/manage_users">Manage students</a>
        </div>
    </div>
{% endblock %}
