{% extends 'base.html' %}
{% block content %}
    <style>
        .card {
            width: 100%;
            max-width: 420px;
            margin: 36px auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 16px 36px rgba(18, 70, 58, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-family: Outfit, "Source Sans 3", sans-serif;
            font-size: 26px;
            color: var(--teal-dark);
        }
        p { margin: 0 0 20px; color: var(--muted); }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
        }
        input:focus {
            outline: 2px solid rgba(15, 107, 92, 0.25);
            border-color: var(--teal);
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--teal);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--teal-dark); }
        .error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--warn-bg);
            color: var(--warn);
            font-size: 14px;
        }
        .link { margin-top: 16px; text-align: center; font-size: 14px; }
        .link a { color: var(--teal); font-weight: 600; }
    </style>
    <form class="card" action="/access/login" method="post">
        <h1>Sign in</h1>
        <p>Enter your email and password to continue.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Sign in</button>
        <div class="link">New here? <a href="/access/register">Create an account</a></div>
    </form>
{% endblock %}
